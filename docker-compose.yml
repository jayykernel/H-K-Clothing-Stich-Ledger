version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hk-clothing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hkclothing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkclothing123}
      POSTGRES_DB: ${POSTGRES_DB:-hkclothing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
